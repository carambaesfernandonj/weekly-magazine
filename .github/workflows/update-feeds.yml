name: Build WEEKLY issue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS and Atom feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts_fetch_rss.py

      - name: Run AI editorial selection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts_editor.py

      - name: Publish issue data
        run: |
          git config user.name "weekly-editor"
          git config user.email "weekly-editor@users.noreply.github.com"
          git add data/articles.json data/editorial.json
          git diff --cached --quiet || git commit -m "Publish WEEKLY issue"
          git push
